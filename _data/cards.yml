cards:
  - id: "card1"
    title: "Online buchen"
    image: "/assets/images/online-buchen.jpg"
    content:
      - subline: "Einfach & komfortabel"
        description: "Hinterlegen Sie Ihre Objekte und Mülltonnen mit nur wenigen Klicks. Schnell, intuitiv und direkt über unsere Webseite. Starten Sie jetzt!"
        mobile_description: "Hinterlegen Sie Ihre Objekte und Mülltonnen in wenigen Schritten online – schnell, intuitiv und bequem."
      - subline: "Transparent & übersichtlich"
        description: "Behalten Sie stets den Überblick: In Ihrem persönlichen Dashboard finden Sie alle Buchungen, Live-Status-Updates, Rechnungen und weitere wichtige Informationen. Alles an einem Ort."
        mobile_description: "Im Dashboard sehen Sie alle Buchungen, Status-Updates und Rechnungen auf einen Blick."
      - subline: "Automatisiert & zuverlässig"
        description: "Ihr Service läuft nahtlos weiter: Gebuchte Objekte und Abholtermine werden automatisch monatlich verlängert, ganz ohne Aufwand für Sie."
        mobile_description: "Ihr Service verlängert sich automatisch – regelmäßige Abholtermine ohne zusätzlichen Aufwand."

  - id: "card2"
    title: "Geld sparen"
    image: "/assets/images/geld-sparen.jpg"
    content:
      - subline: "Bis zu 80% Kosten sparen"
        description: "Durch unser innovatives Modell können die Kosten für den Mülltonnendienst um bis zu 80% gesenkt werden. Kein teurer Hausmeisterservice mehr – wir sorgen für eine effiziente und kostengünstige Lösung."
        mobile_description: "Spare bis zu 80% der Kosten für den Mülltonnendienst – einfach, digital und effizient."
      - subline: "Volle Transparenz & Kontrolle"
        description: "In unserem B2B-Dashboard hast du jederzeit einen Überblick über deine Buchungen, Rechnungen und den aktuellen Status deiner Mülltonnen. Keine versteckten Kosten, keine Überraschungen."
        mobile_description: "Alles im Blick: Buchungen, Rechnungen & Statusupdates in deinem persönlichen Dashboard."
      - subline: "Mehr Zeit & weniger Aufwand"
        description: "Keine manuelle Planung mehr – unser System übernimmt die Organisation und sorgt dafür, dass Mülltonnen pünktlich heraus- und hereingestellt werden. Dadurch sparst du nicht nur Geld, sondern auch wertvolle Zeit."
        mobile_description: "Unser System erledigt alles automatisch – spare Zeit und reduziere den Aufwand."

  - id: "card3"
    title: "Umwelt schonen"
    image: "/assets/images/umwelt-schonen.jpg"
    content:
      - subline: "Reduzierte CO₂-Emissionen"
        description: "Durch unser innovatives System verringern wir unnötige Fahrten drastisch, was zu einer erheblichen Reduzierung von CO₂-Emissionen führt. So helfen wir gemeinsam, die Umwelt zu schützen."
        mobile_description: "Weniger Fahrten bedeuten weniger CO₂ – ein aktiver Beitrag zum Klimaschutz."
      - subline: "Optimierte Müllentsorgung"
        description: "Unser Algorithmus sorgt dafür, dass Mülltonnen genau dann bewegt werden, wenn es nötig ist – ohne unnötige Wege. Das spart Ressourcen und reduziert den ökologischen Fußabdruck."
        mobile_description: "Smarte Planung bedeutet weniger Ressourcenverbrauch und eine effizientere Müllentsorgung."
      - subline: "Nachhaltigkeit durch lokale Unterstützung"
        description: "Unsere Community-basierte Lösung nutzt die Hilfe von Anwohnern und Spaziergängern, um Mülltonnen effizient zu managen. Das vermeidet zusätzliche Fahrtwege und fördert nachhaltige Nachbarschaftshilfe."
        mobile_description: "Lokale Helfer reduzieren unnötige Fahrtwege und fördern eine nachhaltige Gemeinschaft."
