- question: "Wie funktioniert die Beauftragung?"
  answer: "Online registrieren, Standorte und Tonnen anlegen – den Rest übernehmen wir. Abholtermine erkennt das System automatisch."

- question: "Was kostet der Service?"
  answer: "Ab 30 € pro Objekt, abhängig von Standort und Häufigkeit. Den Tarif sehen Sie vor der Buchung im Dashboard."

- question: "Wie erfolgt die Abrechnung?"
  answer: "Monatlich per digitaler Rechnung. Alle Vorgänge bleiben im Dashboard einsehbar."

- question: "Wer stellt die Tonnen bereit?"
  answer: "Geschulte Mitarbeitende stellen die Tonnen pünktlich raus und nach der Leerung wieder rein."

- question: "Was ist mit Feiertagen?"
  answer: "Feiertage und Verschiebungen werden automatisch berücksichtigt. Sie müssen nichts nachhalten."

- question: "Gibt es eine Vertragsbindung?"
  answer: "Nein. Flexibel buchen, pausieren oder beenden – ohne Mindestlaufzeit."
