- question: "Wie funktioniert die Beauftragung?"
  answer: "Einfach online registrieren, Standorte und Tonnen eintragen, den Rest übernehmen wir. Unser System erkennt automatisch alle Abholtermine."

- question: "Was kostet der Service?"
  answer: "Die kosten für die Bereitstellungen beginnen bei 1,75 € pro Tonne. Der genaue Preis hängt von Standort und Häufigkeit ab, transparent im Dashboard einsehbar."

- question: "Wie erfolgt die Abrechnung?"
  answer: "Du erhältst monatlich eine digitale Rechnung per E-Mail. Alle Vorgänge sind auch im Dashboard jederzeit einsehbar."

- question: "Wer bewegt die Tonnen?"
  answer: "Unsere geschulten Mitarbeitenden stellen die Tonnen pünktlich zur Abholung bereit und bringen sie anschließend zuverlässig zurück"

- question: "Was passiert bei Feiertagen oder geänderten Abholzeiten?"
  answer: "Unser System prüft automatisch lokale Feiertage und verschobene Abholtermine. Du musst dich um nichts kümmern."

- question: "Welche Tonnenarten übernimmt tonns?"
  answer: "Wir kümmern uns um Restmüll-, Bio-, Papier- und Plastiktonnen. Egal ob privat oder gewerblich."

- question: "Ist der Service wirklich CO₂-neutral?"
  answer: "Ja. Wir sind zu Fuß oder elektrisch unterwegs."

- question: "Gibt es eine Vertragsbindung oder Mindestlaufzeit?"
  answer: "Nein. Du buchst flexibel nach Bedarf – ganz ohne Laufzeit oder versteckte Gebühren."

- question: "Wie kann ich tonns kündigen oder pausieren?"
  answer: "Einfach per Klick im Dashboard. Es gibt keine Fristen. Du hast jederzeit die volle Kontrolle."
