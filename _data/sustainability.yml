- id: "2"
  title: "Arbeitsplätze"
  description: "Mit unserem Mülltonnenservice schaffen wir nicht nur Ordnung, sondern auch Chancen: Wir bieten lokale, barrierefreie Arbeitsplätze – und das mehrsprachig! Unser Team besteht aus Menschen verschiedenster Herkunft und Fähigkeiten. So ermöglichen wir allen, aktiv am Arbeitsleben teilzunehmen und Teil einer starken Gemeinschaft zu werden."
  image: "/assets/images/arbeitsplaetze.avif"
  alt: "Anlegen Objekte"
  link: "/kunden/hausverwaltungen"

- id: "3"
  title: "Fahrtkosten"
  description: "Dienstleister fahren insgesamt ca. 406 Mio. Kilometer und verursachen hierbei 49,7 Mio. € Kraftstoffkosten. Wir sind vor Ort und reduzieren den Aufwand und die Kosten."
  image: "/assets/images/fahrtkosten.avif"
  alt: "Anlegen Objekte"
  link: "/kunden/eigentuemer"

- id: "4"
  title: "Fahrtzeit"
  description: "Dienstleister verbringen jährlich 37,5 Millionen Stunden auf Fahrten, um Mülltonnen in Deutschland bereitzustellen – Zeit, die nicht produktiv genutzt werden kann. Unsere Lösung hilft, diese Fahrzeiten deutlich zu reduzieren."
  image: "/assets/images/fahrtzeit.avif"
  alt: "Anlegen Objekte"
  link: "/kunden/eigentuemer"