  title: "CO₂-Ausstoß"
  description: "Durch Fahrten zu den Objekten entstehen jährlich rund 69.000 Tonnen CO₂. Wir setzen uns aktiv dafür ein, Emissionen zu reduzieren: Unsere Kolleginnen und Kollegen sind möglichst vor Ort – alternativ fahren wir elektrisch."
