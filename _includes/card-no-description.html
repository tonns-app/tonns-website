<article class="card {{ include.card_classes }}" href="{{ card.link }} ">
  <div class="card-image-container">
    <div class="card-image">
      <img src="{{ card.image }}" alt="{{ card.alt | default: card.title }}" loading="lazy" />
    </div>
  </div>
  <div class="card-content" style="flex-direction: row; align-items: center;">
    <h4>{{ card.title }}</h4>
    <img src="/assets/icons/arrow-right.svg" alt="Icon Beschreibung" width="24" height="24" />
  </div>
</article>
