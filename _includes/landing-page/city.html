<section id="city" class="section section-muted">
  <div class="content">
    <div class="headline-subline reveal">
      <p class="section-kicker">{{ page.sections.city.kicker }}</p>
      <h2>{{ page.sections.city.title }}</h2>
      <p class="section-support">{{ page.sections.city.support }}</p>
    </div>

    <div class="city-grid reveal">
      {% for card in site.data.city %}
      <a class="city-tile" href="{{ card.link }}">
        <img src="{{ card.image }}" alt="{{ card.alt }}" loading="lazy" width="480" height="320" />
        <span>{{ card.title }}</span>
      </a>
      {% endfor %}
    </div>

    <p class="city-note reveal">{{ page.sections.city.note }}</p>
    <a href="{{ page.sections.city.cta_href }}" class="btn btn-green reveal">{{ page.sections.city.cta_label }}</a>
  </div>
</section>
