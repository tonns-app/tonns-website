<section id="city" class="section section-muted">
  <div class="content">
    <div class="headline-subline reveal">
      <p class="section-kicker">Standorte</p>
      <h2>tonns in Ihrer Stadt</h2>
      <p class="section-support">Fürth, Nürnberg, Erlangen, München, Berlin, Köln – und wir wachsen weiter.</p>
    </div>

    <div class="city-grid reveal">
      {% for card in site.data.city %}
      <a class="city-tile" href="{{ card.link }}">
        <img src="{{ card.image }}" alt="{{ card.alt }}" loading="lazy" width="480" height="320" />
        <span>{{ card.title }}</span>
      </a>
      {% endfor %}
    </div>

    <p class="city-note reveal">
      Ihre Stadt fehlt? Schreiben Sie uns – wir prüfen, ob und wann wir starten.
    </p>
    <a href="#contact" class="btn btn-green reveal">Kontakt aufnehmen</a>
  </div>
</section>
