<section id="customers" class="section">
  <div class="content">
    <div class="headline-subline reveal">
      <p class="section-kicker">Für wen?</p>
      <h2>Gemacht für die, die Objekte am Laufen halten.</h2>
    </div>

    <div class="audience-grid reveal">
      {% for card in site.data.customers %}
      <a class="audience-tile" href="{{ card.link }}">
        <img src="{{ card.image }}" alt="{{ card.alt }}" loading="lazy" width="640" height="420" />
        <div class="audience-tile-body">
          <h3>{{ card.title }}</h3>
          <p>{{ card.description }}</p>
          <span class="text-link">Zur Zielseite</span>
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
