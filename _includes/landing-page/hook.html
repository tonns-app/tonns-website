<section id="hook" class="section section-hook">
  <div class="content hook-content">
    <div class="hook-copy reveal">
      <p class="section-kicker">{{ page.hook.kicker }}</p>
      <h2>{{ page.hook.title }}</h2>
      <p class="hook-lead">{{ page.hook.lead }}</p>
    </div>
    <ul class="hook-points reveal">
      {% for point in page.hook.points %}
      <li>
        <strong>{{ point.title }}</strong>
        <span>{{ point.text }}</span>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
