<section id="workflow" class="section section-muted">
  <div class="content">
    <div class="headline-subline reveal">
      <p class="section-kicker">{{ page.sections.workflow.kicker }}</p>
      <h2>{{ page.sections.workflow.title }}</h2>
    </div>

    <div class="steps-grid reveal">
      {% for card in site.data.workflow %}
      <article class="step-item">
        <div class="step-media">
          <img src="{{ card.image }}" alt="{{ card.alt }}" loading="lazy" width="480" height="320" />
        </div>
        <h3>{{ card.title }}</h3>
        <p>{{ card.description }}</p>
      </article>
      {% endfor %}
    </div>

    <a href="{{ page.sections.workflow.cta_href }}" class="btn btn-green reveal">{{ page.sections.workflow.cta_label }}</a>
  </div>
</section>
