<section id="workflow" class="section section-muted">
  <div class="content">
    <div class="headline-subline reveal">
      <p class="section-kicker">In drei Schritten</p>
      <h2>Anlegen. Laufen lassen. Entspannen.</h2>
    </div>

    <ol class="steps-grid reveal">
      {% for card in site.data.workflow %}
      <li class="step-item">
        <span class="step-index">{{ forloop.index }}</span>
        <div class="step-media">
          <img src="{{ card.image }}" alt="{{ card.alt }}" loading="lazy" width="480" height="320" />
        </div>
        <h3>{{ card.title }}</h3>
        <p>{{ card.description }}</p>
      </li>
      {% endfor %}
    </ol>

    <a href="#action-check" class="btn btn-green reveal">Termine prüfen</a>
  </div>
</section>
