<section id="opener">
  <div id="teaser-container">
    <figure>
      <img
        src="{{ page.opener.image }}"
        srcset="{{ page.opener.image_768 }} 768w, {{ page.opener.image_1280 }} 1280w, {{ page.opener.image }} 1920w"
        sizes="100vw"
        alt="{{ page.opener.alt }}"
        width="1920"
        height="1080"
        fetchpriority="high"
        decoding="async"
        class="opener"
      />
      <figcaption>{{ page.opener.caption }}</figcaption>
    </figure>
    <div class="teaser-text-container reveal-in">
      <p class="brand-mark">{{ page.opener.brand }}</p>
      <h1 class="teaser-headline">
        {{ page.opener.headline_line1 }}<br />
        {{ page.opener.headline_line2 }}
      </h1>
      <p class="teaser-subline">{{ page.opener.subline }}</p>
      <div class="teaser-btn-container">
        <a href="{{ page.opener.primary_cta.href }}" class="btn btn-green">{{ page.opener.primary_cta.label }}</a>
        <a href="{{ page.opener.secondary_cta.href }}" class="btn btn-outline-white">{{ page.opener.secondary_cta.label }}</a>
      </div>
    </div>
  </div>
  <div id="opener-end-marker" style="height: 1px"></div>
</section>
