<section class="section section-advantages">
  <div class="content">
    <div class="headline-subline reveal">
      <p class="section-kicker">Ihre Vorteile</p>
      <h2>Weniger Chaos. Mehr Ruhe im Objekt.</h2>
    </div>

    <div class="feature-rows">
      {% for card in site.data.advantages %}
      {% assign mod = forloop.index | modulo: 2 %}
      <article class="feature-row reveal{% if mod == 0 %} feature-row--flip{% endif %}">
        <div class="feature-row-media">
          <img src="{{ card.image }}" alt="{{ card.alt }}" loading="lazy" width="560" height="400" />
        </div>
        <div class="feature-row-text">
          <h3>{{ card.title }}</h3>
          <p>{{ card.description }}</p>
          <a href="{{ card.link }}" class="text-link">Mehr erfahren</a>
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
