<a class="card" href="{{ card.link }}">
  <div class="card-image-container">
    <div class="card-image">
      <img src="{{ card.image }}" alt="{{ card.alt | default: card.title }}" loading="lazy" />
    </div>
  </div>
  <h4>{{ card.title }}</h4>
  <span>{{ card.description | markdownify }}</span>
</a>
