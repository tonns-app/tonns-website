<article class="card {{ include.card_classes }}">
  <div class="card-image-container">
    <div class="card-image">
      <img src="{{ include.card.image }}" alt="{{ include.card.alt | default: include.card.title }}" loading="lazy" width="400" height="290" />
    </div>
  </div>
  <div class="card-content">
    <h3 class="card-title">{{ include.card.title }}</h3>
    <span>{{ include.card.description }}</span>
  </div>
</article>
