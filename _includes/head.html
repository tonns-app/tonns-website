<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />

<meta name="robots" content="index,follow,max-image-preview:large" />
<meta name="author" content="{{ site.company }}" />
<meta name="theme-color" content="#0f7a38" />
<meta name="geo.region" content="DE-BY" />
<meta name="geo.placename" content="{{ site.city_name }}" />

{% if site.google_site_verification %}
<meta name="google-site-verification" content="{{ site.google_site_verification }}" />
{% endif %}

<link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png" />
<link rel="apple-touch-icon" href="{{ '/favicon.png' | relative_url }}" />

<link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}" as="style" />
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

{% include scripts/cookie.html %}
